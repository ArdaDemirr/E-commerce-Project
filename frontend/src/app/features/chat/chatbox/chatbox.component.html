<div
  class="flex-1 w-full flex h-full min-h-[85vh] bg-white rounded-xl shadow-lg border border-slate-300 overflow-hidden"
>
  <!-- Sidebar -->
  <div
    class="flex-none w-72 min-w-[288px] max-w-[288px] bg-slate-50 border-r border-slate-300 flex flex-col z-10"
  >
    <div class="p-5 border-b border-slate-300 bg-slate-100 flex-shrink-0">
      <button
        (click)="startNewSession()"
        class="w-full flex items-center justify-center space-x-2 bg-indigo-600 text-white px-4 py-3 rounded-xl font-bold shadow-md hover:bg-indigo-700 hover:shadow-lg focus:outline-none transition-all transform hover:-translate-y-0.5"
      >
        <lucide-icon name="plus" size="20"></lucide-icon>
        <span>NEW CHAT</span>
      </button>
    </div>
    <div class="flex-1 overflow-y-auto w-full p-3 space-y-2">
      <h3
        class="text-xs font-bold text-slate-400 mb-3 mt-2 px-2 uppercase tracking-wider"
      >
        Chat History
      </h3>
      <div
        *ngFor="let session of sessions"
        (click)="selectSession(session.id)"
        class="p-3 rounded-lg border cursor-pointer hover:bg-white transition-all shadow-sm flex items-center justify-between group overflow-hidden"
        [ngClass]="{
          'bg-white border-indigo-400 ring-2 ring-indigo-100':
            session.id === activeSessionId,
          'bg-transparent border-slate-200': session.id !== activeSessionId,
        }"
      >
        <div class="flex items-center flex-1 min-w-0 pr-2">
          <lucide-icon
            name="message-square"
            size="16"
            class="mr-3 shrink-0"
            [ngClass]="{
              'text-indigo-600': session.id === activeSessionId,
              'text-slate-400': session.id !== activeSessionId,
            }"
          ></lucide-icon>
          <div
            class="font-medium truncate flex-1"
            [ngClass]="{
              'text-indigo-900 font-bold': session.id === activeSessionId,
              'text-slate-600 group-hover:text-slate-900':
                session.id !== activeSessionId,
            }"
          >
            {{ session.title }}
          </div>
        </div>

        <button
          *ngIf="sessions.length > 1"
          (click)="deleteSession($event, session.id)"
          class="shrink-0 p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-100 transition-all rounded shadow-sm focus:outline-none"
          title="Delete chat"
        >
          <lucide-icon name="trash-2" size="16"></lucide-icon>
        </button>
      </div>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="flex flex-col flex-auto bg-white min-w-0" style="flex: 1 1 auto">
    <!-- Header -->
    <div
      class="bg-indigo-600 px-6 py-4 flex items-center justify-between shrink-0 shadow-md z-10"
    >
      <div class="flex items-center space-x-3">
        <div
          class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-indigo-600 shadow-sm"
        >
          <lucide-icon name="bot"></lucide-icon>
        </div>
        <div>
          <h2 class="text-white text-lg font-semibold">
            DataPulse AI Assistant
          </h2>
          <p class="text-indigo-200 text-sm">Always here to help</p>
        </div>
      </div>
    </div>

    <!-- Messages -->
    <div
      class="flex-1 overflow-y-auto p-6 bg-slate-50 flex flex-col space-y-5 min-h-0"
      #scrollMe
    >
      <div
        *ngFor="let msg of activeSessionMessages"
        class="flex w-full"
        [ngClass]="{
          'justify-end': msg.role === 'user',
          'justify-start': msg.role === 'ai',
        }"
      >
        <!-- Bot Message -->
        <div
          *ngIf="msg.role === 'ai'"
          class="flex items-start space-x-3 max-w-[80%]"
        >
          <div
            class="w-10 h-10 rounded-full bg-white border border-indigo-100 shadow-sm flex items-center justify-center flex-shrink-0 text-indigo-600 mt-1"
          >
            <lucide-icon name="bot" size="20"></lucide-icon>
          </div>
          <div
            class="bg-white px-5 py-4 rounded-2xl rounded-tl-sm shadow-md border border-slate-100 text-slate-800 text-[15px] leading-relaxed whitespace-pre-wrap"
          >
            <div>{{ msg.content }}</div>

            <!-- ApexCharts Integration -->
            <div
              *ngIf="msg.chartType"
              class="chart-wrapper mt-4 bg-white border border-slate-100 rounded-xl p-3 shadow-inner overflow-hidden"
              style="width: 100%; min-width: 320px; max-width: 450px"
            >
              <apx-chart
                *ngIf="msg.chartType === 'pie' || msg.chartType === 'donut'"
                [series]="msg.chartSeries!"
                [chart]="{
                  type: msg.chartType,
                  height: 300,
                  animations: { enabled: true },
                }"
                [labels]="msg.chartLabels!"
                [legend]="{ position: 'bottom', labels: { colors: '#64748b' } }"
                [stroke]="{ show: false }"
                [dataLabels]="{ enabled: true, dropShadow: { enabled: false } }"
              >
              </apx-chart>

              <apx-chart
                *ngIf="msg.chartType === 'bar' || msg.chartType === 'line'"
                [series]="msg.chartSeries!"
                [chart]="{
                  type: msg.chartType,
                  height: 300,
                  toolbar: { show: false },
                  animations: { enabled: true },
                }"
                [xaxis]="{
                  categories: msg.chartLabels,
                  labels: { style: { colors: '#64748b' } },
                }"
                [yaxis]="{ labels: { style: { colors: '#64748b' } } }"
                [grid]="{ borderColor: '#f1f5f9' }"
                [dataLabels]="{ enabled: false }"
                [colors]="['#6366f1']"
              >
              </apx-chart>
            </div>
          </div>
        </div>

        <!-- User Message -->
        <div
          *ngIf="msg.role === 'user'"
          class="flex items-start space-x-3 max-w-[80%] flex-row-reverse space-x-reverse"
        >
          <div
            class="bg-indigo-600 px-5 py-4 rounded-2xl rounded-tr-sm shadow-md text-white text-[15px] leading-relaxed whitespace-pre-wrap mt-1"
          >
            {{ msg.content }}
          </div>
        </div>
      </div>

      <!-- Processing Indicator -->
      <div
        *ngIf="isProcessing"
        class="flex items-start space-x-3 w-full max-w-[80%]"
      >
        <div
          class="w-10 h-10 rounded-full bg-white border border-indigo-100 shadow-sm flex items-center justify-center flex-shrink-0 text-indigo-600 mt-1"
        >
          <lucide-icon name="bot" size="20"></lucide-icon>
        </div>
        <div
          class="bg-white px-5 py-4 rounded-2xl rounded-tl-sm shadow-md border border-slate-100 flex space-x-2 items-center h-12"
        >
          <div
            class="w-2.5 h-2.5 bg-indigo-400 rounded-full animate-bounce"
          ></div>
          <div
            class="w-2.5 h-2.5 bg-indigo-400 rounded-full animate-bounce"
            style="animation-delay: 0.15s"
          ></div>
          <div
            class="w-2.5 h-2.5 bg-indigo-400 rounded-full animate-bounce"
            style="animation-delay: 0.3s"
          ></div>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="bg-white p-5 border-t border-slate-200 shrink-0">
      <form
        (ngSubmit)="sendMessage()"
        class="flex items-center space-x-3 bg-slate-50 p-2 rounded-2xl border border-slate-300 shadow-inner focus-within:ring-2 focus-within:ring-indigo-200 transition-all"
      >
        <input
          type="text"
          [(ngModel)]="newMessage"
          name="message"
          placeholder="Type your message to DataPulse..."
          class="flex-1 bg-transparent border-none focus:ring-0 text-[15px] px-4 outline-none placeholder-slate-400"
          [disabled]="isProcessing"
          autocomplete="off"
        />
        <button
          type="submit"
          [disabled]="!newMessage.trim() || isProcessing"
          class="w-12 h-12 rounded-xl bg-indigo-600 text-white flex items-center justify-center hover:bg-indigo-700 shadow-md transition-all disabled:opacity-50 disabled:cursor-not-allowed transform hover:scale-105 active:scale-95 disabled:hover:scale-100"
        >
          <lucide-icon name="send" size="20" class="ml-1"></lucide-icon>
        </button>
      </form>
    </div>
  </div>
</div>
