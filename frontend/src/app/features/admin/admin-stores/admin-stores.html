<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-white">Sistemdeki Mağazalar</h1>
      <p class="text-slate-400 text-sm mt-1">Sitede satış yapan corporate kullanıcıları görüntüleyin.</p>
    </div>
    <button (click)="loadStores()" class="flex items-center gap-2 px-4 py-2 bg-slate-800 text-white rounded-xl hover:bg-slate-700 transition border border-slate-700 shadow-sm">
      <lucide-icon name="refresh-cw" [size]="18" [class.animate-spin]="loading"></lucide-icon>
      Yenile
    </button>
  </div>

  <div *ngIf="loading" class="flex justify-center py-12">
    <div class="w-8 h-8 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
  </div>

  <div *ngIf="!loading" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
    <div *ngFor="let store of stores" class="glass-card p-6 flex flex-col items-center text-center relative overflow-hidden group">
      
      <!-- Status Badge -->
      <div class="absolute top-4 right-4">
        <span class="px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider border"
              [ngClass]="store.active ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20'">
          {{ store.active ? 'AKTİF' : 'PASİF' }}
        </span>
      </div>

      <!-- Icon/Avatar -->
      <div class="w-20 h-20 bg-slate-800/80 rounded-full flex items-center justify-center mb-4 border border-slate-700 mx-auto shadow-inner">
        <lucide-icon name="store" [size]="32" class="text-primary/80"></lucide-icon>
      </div>

      <h3 class="text-lg font-bold text-white mb-1">{{ store.name }} {{ store.surname }}</h3>
      <p class="text-sm text-slate-400 mb-4">{{ store.email }}</p>
      
      <div class="w-full h-px bg-gradient-to-r from-transparent via-slate-700 to-transparent mb-4"></div>

      <button (click)="toggleActive(store)" 
              class="w-full px-4 py-2 rounded-lg text-sm font-medium transition-all"
              [ngClass]="store.active ? 'bg-slate-800 hover:bg-rose-500/10 text-rose-400 border border-slate-700 hover:border-rose-500/30' : 'bg-slate-800 hover:bg-emerald-500/10 text-emerald-400 border border-slate-700 hover:border-emerald-500/30'">
        <lucide-icon [name]="store.active ? 'x-circle' : 'check-circle'" [size]="16" class="inline mr-2 -mt-0.5"></lucide-icon>
        {{ store.active ? 'Mağazayı Askıya Al' : 'Mağazayı Etkinleştir' }}
      </button>
    </div>

    <!-- Empty state -->
    <div *ngIf="stores.length === 0" class="col-span-full glass-card p-12 text-center">
      <lucide-icon name="store" [size]="48" class="text-slate-600 mx-auto mb-4"></lucide-icon>
      <p class="text-slate-400">Sistemde henüz kayıtlı satıcı (Corporate) hesabı bulunmamaktadır.</p>
    </div>
  </div>
</div>
