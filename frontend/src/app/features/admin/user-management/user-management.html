<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-white">Kullanıcı Yönetimi</h1>
      <p class="text-slate-400 text-sm mt-1">Sistemdeki tüm kullanıcıları ve mağazaları yönetin.</p>
    </div>
    <button (click)="loadUsers()" class="flex items-center gap-2 px-4 py-2 bg-slate-800 text-white rounded-xl hover:bg-slate-700 transition border border-slate-700 shadow-sm">
      <lucide-icon name="refresh-cw" [size]="18" [class.animate-spin]="loading"></lucide-icon>
      Hızlı Yenile
    </button>
  </div>

  <div *ngIf="loading" class="flex justify-center py-12">
    <div class="w-8 h-8 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
  </div>

  <div *ngIf="!loading" class="glass-card overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-800/50 border-b border-slate-700 text-slate-400 text-xs uppercase tracking-wider">
            <th class="p-4 font-semibold w-12 text-center">ID</th>
            <th class="p-4 font-semibold">Ad Soyad</th>
            <th class="p-4 font-semibold">Email</th>
            <th class="p-4 font-semibold w-40 text-center">Rol</th>
            <th class="p-4 font-semibold w-24 text-center">Durum</th>
            <th class="p-4 font-semibold w-24 text-center">İşlem</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-700/50">
          <tr *ngFor="let user of users" class="hover:bg-slate-800/30 transition">
            <td class="p-4 text-slate-300 font-mono text-center">#{{ user.id }}</td>
            <td class="p-4">
              <div class="font-medium text-slate-200">{{ user.name }} {{ user.surname }}</div>
              <div class="text-xs text-slate-500">{{ user.gender || 'Bilinmiyor' }}</div>
            </td>
            <td class="p-4 text-slate-300">{{ user.email }}</td>
            <td class="p-4 text-center">
              <select [ngModel]="user.role" (ngModelChange)="changeRole(user, $event)" 
                      class="bg-slate-800 border border-slate-600 rounded text-xs text-slate-200 px-2 py-1 outline-none focus:border-primary">
                <option value="INDIVIDUAL">Bireysel</option>
                <option value="CORPORATE">Corporate</option>
                <option value="ADMIN">Admin</option>
              </select>
            </td>
            <td class="p-4 text-center">
              <button (click)="toggleActive(user)" 
                      class="px-2 py-1 flex items-center justify-center gap-1 w-full rounded text-xs font-medium border"
                      [ngClass]="user.active ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20 hover:bg-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20 hover:bg-rose-500/20'">
                {{ user.active ? 'Aktif' : 'Pasif' }}
              </button>
            </td>
            <td class="p-4 text-center">
              <button (click)="deleteUser(user.id)" class="p-1.5 text-rose-400 hover:text-white hover:bg-rose-500 rounded transition" title="Kullanıcıyı Sil">
                <lucide-icon name="trash-2" [size]="16"></lucide-icon>
              </button>
            </td>
          </tr>
          <tr *ngIf="users.length === 0">
            <td colspan="6" class="p-8 text-center text-slate-500">
              Kayıtlı kullanıcı bulunamadı.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
