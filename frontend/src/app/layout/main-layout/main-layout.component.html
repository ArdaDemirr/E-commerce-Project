<div class="flex h-screen bg-background overflow-hidden">
  <!-- Sidebar -->
  <app-sidebar [isCollapsed]="sidebarCollapsed" (toggleSidebar)="toggleSidebar()">
  </app-sidebar>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col transition-all duration-300 min-h-screen w-full relative"
    [class.md:ml-64]="!sidebarCollapsed" [class.md:ml-16]="sidebarCollapsed">

    <!-- Navbar: Stuck to top -->
    <div class="sticky top-0 z-30 w-full">
      <app-navbar (toggleSidebar)="toggleSidebar()" [sidebarCollapsed]="sidebarCollapsed">
      </app-navbar>
    </div>

    <!-- Page Content -->
    <main class="flex-1 p-4 md:p-6 overflow-y-auto bg-background relative z-10 h-[calc(100vh-4rem)]">
      <div class="animate__animated animate__fadeIn max-w-7xl mx-auto w-full">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
